name: Build unsigned preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version, including a preview suffix
        required: true
        default: 0.1.0-preview
      sequence:
        description: Positive monotonic runtime release number
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: aarch64-apple-darwin
            ffmpeg_url_var: FFMPEG_MACOS_URL
            ffmpeg_hash_var: FFMPEG_MACOS_SHA256
            bundle: dmg
          - os: windows-2022
            platform: x86_64-pc-windows-msvc
            ffmpeg_url_var: FFMPEG_WINDOWS_URL
            ffmpeg_hash_var: FFMPEG_WINDOWS_SHA256
            bundle: nsis
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      SEQUENCE: ${{ inputs.sequence }}
      RUNTIME_URL_BASE: ${{ vars.RUNTIME_URL_BASE }}
      FFMPEG_URL: ${{ vars[matrix.ffmpeg_url_var] }}
      FFMPEG_SHA256: ${{ vars[matrix.ffmpeg_hash_var] }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.7
      - run: uv sync --locked --all-packages --extra inference
      - run: npm ci
      - run: npm run check
      - run: uv run --locked --all-packages --extra inference pytest tests deploy/tests -m "not inference and not cloud"
      - name: Fetch owner-selected, hash-pinned FFmpeg
        shell: bash
        run: |
          test -n "$FFMPEG_URL" && test -n "$FFMPEG_SHA256"
          python deploy/fetch_ffmpeg.py --url "$FFMPEG_URL" --sha256 "$FFMPEG_SHA256" --output dist/ffmpeg
      - name: Generate dependency notices
        run: uv run --locked --all-packages --extra inference python deploy/build_sources.py --inventory-only
      - name: Build and smoke the native directory runtime
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          test -n "$RUNTIME_URL_BASE"
          uv run --locked --all-packages --extra inference python scripts/build_runtime.py build \
            --ffmpeg-dir dist/ffmpeg --version "$VERSION" --sequence "$SEQUENCE" \
            --url "$RUNTIME_URL_BASE/voice-runtime-$VERSION-$TARGET.zip"
      - name: Align preview installer and runtime versions
        run: python deploy/preview_config.py
      - name: Build clearly unsigned desktop preview
        env:
          VOICE_RUNTIME_PUBLIC_KEY: ''
          VOICE_UPDATE_PUBLIC_KEY: ''
          VOICE_UPDATE_URL: ''
        run: npm run desktop:build -- --config ../../deploy/tauri.preview.generated.json --bundles ${{ matrix.bundle }}
      - name: Create explicit preview status
        shell: bash
        run: |
          uv run --locked --all-packages --extra inference python scripts/release_gate.py --channel preview --version "$VERSION" --commit "$GITHUB_SHA" > dist/UNSIGNED-PREVIEW.json
          uv run --locked --all-packages --extra inference python deploy/build_sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-PREVIEW-${{ matrix.platform }}
          path: |
            dist/runtime/*.zip
            dist/runtime/*.manifest.json
            dist/UNSIGNED-PREVIEW.json
            dist/sources/
            apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
