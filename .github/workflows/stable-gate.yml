name: Verify stable release evidence
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version
        required: true
      evidence_run_id:
        description: Same-repository run containing an actual stable-release-evidence artifact
        required: true
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    environment: stable-release
    env:
      VOICE_RUNTIME_PUBLIC_KEY: ${{ vars.VOICE_RUNTIME_PUBLIC_KEY }}
      VOICE_UPDATE_PUBLIC_KEY: ${{ vars.VOICE_UPDATE_PUBLIC_KEY }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.7
      - run: uv sync --locked --all-packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stable-release-evidence
          path: evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Gate exact commit, quality, lifecycle, both OS signatures, and updater
        run: |
          uv run --locked python scripts/release_gate.py --channel stable \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --evidence-dir evidence \
            --qualification evidence/qualification.json --signatures evidence/signatures.json \
            > stable-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-gate-result
          path: stable-gate.json
          if-no-files-found: error
