[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-studio-core"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<3",
  "boto3>=1.37,<2", "psycopg[binary]>=3.2,<4", "cryptography>=44,<48",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_studio_core"]
