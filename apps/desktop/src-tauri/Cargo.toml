[package]
name = "voice-studio-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "io-util", "time", "fs"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.9"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
url = "2"
futures-util = "0.3"
fs2 = "0.4"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
